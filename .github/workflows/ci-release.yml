name: CI and Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: build/libs/*.jar

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Get project version
        id: project_version
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties | awk -F': ' '/^version: /{print $2}')
          if [ -z "$VERSION" ]; then
            echo "Gradle version is empty. Check build.gradle." >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.project_version.outputs.version }}
          name: v${{ steps.project_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/*.jar